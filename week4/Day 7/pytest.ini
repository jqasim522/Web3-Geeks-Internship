[pytest]
env_files =
    .env
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests that take >5 seconds
    live: marks tests that require real API credentials (deselect with -m "not live")
    unit: pure unit tests
    integration: tests across multiple modules
    e2e: end-to-end scenario tests
    adversarial: security / red-team tests
    fuzz: property-based / fuzz tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
