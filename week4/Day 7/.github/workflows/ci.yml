name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Syntax check all lib modules
        run: |
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('lib').rglob('*.py')]; print('syntax OK')"

      - name: Offline self-tests
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          python -m lib.graph_nodes || true
          python -m lib.booking_tool || true

      - name: Unit + integration tests (offline only)
        run: |
          pytest tests/unit tests/integration -q --maxfail=3 || true
