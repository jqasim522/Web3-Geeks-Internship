# deploy/docker-compose.yml
#
# STATUS: USER DEPLOYS
# TARGET: Ubuntu 22.04+ with Docker Compose v2 (`docker compose`, not the
#         standalone `docker-compose` v1 binary)
# RUN ON USER MACHINE (from repo root):
#   docker compose -f deploy/docker-compose.yml up -d --build
# EXPECTED: Three containers running: voice-agent (the app), nginx (reverse
#           proxy + TLS termination), certbot (one-shot SSL cert issuance/
#           renewal). This has never been run — verify locally before using
#           it on a real server.

services:
  voice-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: voice-agent
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ../data:/app/data
      - ./logs/app:/app/logs
      - ./secrets:/app/secrets:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Not published to the host directly — nginx is the only public entry
    # point. Uncomment for local debugging without nginx in front:
    # ports:
    #   - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: voice-agent-nginx
    restart: unless-stopped
    depends_on:
      - voice-agent
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - internal
      - exposed
    # Re-reads nginx.conf every 6h and reloads without dropping connections,
    # so a renewed cert is picked up without a manual restart.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: voice-agent-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # One-shot by default (see deploy/README.md for the exact first-issuance
    # command). This entrypoint renews any existing cert every 12h and exits
    # immediately if there is nothing to renew yet.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

networks:
  internal:
    driver: bridge
    internal: true
  exposed:
    driver: bridge
