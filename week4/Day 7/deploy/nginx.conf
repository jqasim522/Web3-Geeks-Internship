# deploy/nginx.conf
#
# STATUS: USER DEPLOYS — replace YOUR_DOMAIN.com with your real domain
#         before use. This config will not work as-is.
# TARGET: nginx 1.24+ (matches the nginx:1.27-alpine image in
#         docker-compose.yml), Ubuntu 22.04+ host
# RUN ON USER MACHINE: mounted read-only into the nginx container by
#         docker-compose.yml — no separate install step needed under Docker.
#         For a bare-metal (non-Docker) nginx, copy to
#         /etc/nginx/sites-available/voice-agent, symlink into
#         sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
# EXPECTED: HTTP requests to YOUR_DOMAIN.com redirect to HTTPS; HTTPS
#           requests are reverse-proxied to voice-agent:8000. Untested —
#           no SSL cert or domain exists in the environment that wrote this.

# Rate limiting zone: 10 requests/second per client IP, matching the spec.
limit_req_zone $binary_remote_addr zone=voiceagent_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com;

    # Let Certbot's HTTP-01 challenge through unencrypted.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: force HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN.com;

    # Paths match the certbot/conf volume in docker-compose.yml. These files
    # do not exist until Certbot has actually issued a certificate — see
    # deploy/README.md's SSL setup step. nginx will fail to start without them.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/voice-agent.access.log;
    error_log  /var/log/nginx/voice-agent.error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=voiceagent_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://voice-agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Voice/streaming endpoints may hold connections open longer than
        # nginx's 60s default — raise if you see 504s on long voice turns.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Health check endpoint — excluded from rate limiting so monitoring
    # tools (UptimeRobot, Prometheus) aren't throttled. See docs/healthcheck.md.
    location /health {
        proxy_pass http://voice-agent:8000/health;
        access_log off;
    }
}
